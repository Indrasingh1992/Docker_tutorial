version: "3.1"

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql
    ports:
      - "1433:1433" # expose SQL Server port
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Strong!Passw0rd"
      MSSQL_PID: "Express" # optional edition tag
    volumes:
      - mssql_data:/var/opt/mssql
    restart: always

volumes:
  mssql_data:

